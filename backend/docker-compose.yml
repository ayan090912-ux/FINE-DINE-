version: '3.8'

services:
  # DineFlow FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dineflow_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DineFlow SaaS Backend
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://dineflow_user:dineflow_password@postgres:5432/dineflow_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://dineflow_user:dineflow_password@postgres:5432/dineflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-in-production-super-secret-key-dineflow-saas-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: dineflow_postgres
    restart: always
    environment:
      POSTGRES_USER: dineflow_user
      POSTGRES_PASSWORD: dineflow_password
      POSTGRES_DB: dineflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineflow_user -d dineflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: dineflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Database Admin UI (Optional for Development)
  adminer:
    image: adminer:latest
    container_name: dineflow_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
